name: Build macOS

# Builds a native DMG + ZIP for Apple Silicon (arm64) and Intel (x64).
# The PyInstaller backend is architecture-specific, so each arch is built on a
# matching runner instead of cross-compiling.
#
# Each build job verifies its own artifacts (unzip -t / hdiutil verify) and,
# for tagged builds, uploads them straight to the GitHub Release from the
# macOS runner. Earlier versions bounced the files through an artifact +
# a separate Linux release job, which produced corrupted zips/dmgs.
#
# Triggers:
#   * push of a `v*` tag            -> build + publish GitHub Release
#   * workflow_dispatch             -> build only (or release when `release` = true)
#   * called by pmd3-watch.yml      -> automatic release after a pymobiledevice3 bump

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a GitHub Release from this build'
        type: boolean
        default: false

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.13'
  NODE_VERSION: '22'

jobs:
  build:
    name: build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15          # Apple Silicon
            arch: arm64
          - runner: macos-15-intel    # Intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pyinstaller
          # Make sure cryptography is the official pre-built wheel (OpenSSL
          # statically linked). A source build links Homebrew's OpenSSL 3.5
          # dynamically and then clashes with Python's bundled 3.0 inside
          # the PyInstaller bundle.
          python -m pip install --only-binary=:all: --force-reinstall --no-deps cryptography
          python scripts/smoke_test_backend.py
          echo "--- cryptography wheel diagnostics ---"
          python -m pip show cryptography | head -3
          python - <<'EOF'
          import subprocess, cryptography.hazmat.bindings._rust as r
          print(r.__file__)
          print(subprocess.run(["otool", "-L", r.__file__], capture_output=True, text=True).stdout)
          EOF

      - name: Build backend (PyInstaller)
        working-directory: backend
        run: |
          python -m PyInstaller locwarp-backend.spec --noconfirm \
            --distpath "$GITHUB_WORKSPACE/dist-py" \
            --workpath "$GITHUB_WORKSPACE/build-py/backend"
          ls -la "$GITHUB_WORKSPACE/dist-py/locwarp-backend" | head
          test -x "$GITHUB_WORKSPACE/dist-py/locwarp-backend/locwarp-backend"

      - name: Boot test the frozen backend
        # Start the PyInstaller bundle exactly like Electron will, wait for
        # the HTTP API, then stop it. Catches missing modules / dylib
        # mismatches (e.g. the libssl 3.0 vs 3.2 collision) before we ship.
        run: |
          BIN="$GITHUB_WORKSPACE/dist-py/locwarp-backend/locwarp-backend"
          echo "--- OpenSSL libs bundled ---"
          ls -la "$GITHUB_WORKSPACE/dist-py/locwarp-backend/_internal" | grep -iE 'libssl|libcrypto' || true
          otool -L "$GITHUB_WORKSPACE/dist-py/locwarp-backend/_internal/cryptography/hazmat/bindings/_rust.abi3.so" | head -5 || true
          echo "--- boot ---"
          LOCWARP_TUNNEL_MODE=userspace "$BIN" > backend-boot.log 2>&1 &
          PID=$!
          ok=0
          for i in $(seq 1 45); do
            if curl -sf http://127.0.0.1:8777/ >/dev/null 2>&1; then ok=1; break; fi
            if ! kill -0 "$PID" 2>/dev/null; then break; fi
            sleep 1
          done
          kill "$PID" 2>/dev/null || true
          sleep 1
          echo "--- backend output ---"
          cat backend-boot.log
          if [ "$ok" != 1 ]; then echo "::error::frozen backend did not answer on :8777"; exit 1; fi
          echo "frozen backend booted OK"

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend (Vite)
        working-directory: frontend
        run: npm run build

      - name: Package DMG + ZIP (electron-builder)
        working-directory: frontend
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac --${{ matrix.arch }} --publish never

      - name: Verify artifacts and write checksums
        # A corrupted archive must never reach a release. unzip -t walks every
        # entry; hdiutil verify checks the DMG's embedded checksum.
        working-directory: frontend/release
        run: |
          rm -f *.blockmap
          ls -la . | grep -E '\.(dmg|zip)$'
          for z in *.zip; do
            echo "--- unzip -t $z ---"
            unzip -tq "$z"
          done
          for d in *.dmg; do
            echo "--- hdiutil verify $d ---"
            hdiutil verify "$d"
          done
          shasum -a 256 *.dmg *.zip | tee "SHA256SUMS-${{ matrix.arch }}.txt"

      - uses: actions/upload-artifact@v5
        with:
          name: LocWarp-mac-${{ matrix.arch }}
          path: |
            frontend/release/*.dmg
            frontend/release/*.zip
            frontend/release/SHA256SUMS-*.txt
          compression-level: 0
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', github.run_number) }}
          name: LocWarp Mac ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', github.run_number) }}
          body_path: .github/release-footer.md
          files: |
            frontend/release/*.dmg
            frontend/release/*.zip
            frontend/release/SHA256SUMS-*.txt
          fail_on_unmatched_files: true
